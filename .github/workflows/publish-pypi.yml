name: publish to PyPI

# Trusted Publishing: no API token exists anywhere. GitHub signs a short-lived
# OIDC identity for this specific workflow in this specific repository, and
# PyPI accepts it because you told PyPI to trust exactly that. Nothing to
# store, nothing to leak, nothing to rotate.
#
# One-time setup on PyPI (see DISTRIBUTION.md):
#   PyPI → Your projects → Publishing → Add a new pending publisher
#     PyPI project name : alto-connector
#     Owner             : lukebmandel-debug
#     Repository name   : alto-connector
#     Workflow name     : publish-pypi.yml
#     Environment       : pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The three runtime templates live outside the package in the repo and
      # are copied in at build time; without this the wheel installs but
      # cannot render anything.
      - name: Stage the engine templates
        run: python packaging/stage_engine.py

      - name: Build
        run: |
          python -m pip install --quiet --upgrade pip build
          python -m build

      - name: Check the templates really made it into the wheel
        run: |
          python - <<'PY'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          need = ["alto/engine/timeline_template.html",
                  "alto/engine/home_template.html",
                  "alto/engine/reports_template.html"]
          missing = [n for n in need if n not in names]
          if missing:
              sys.exit(f"wheel is missing {missing} — it would install but not build")
          leaked = [n for n in names if "FROZEN" in n or "TEMPLATE_MANIFEST" in n]
          if leaked:
              sys.exit(f"private fixtures leaked into the wheel: {leaked}")
          print(f"{wheel}: templates present, no private fixtures")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write        # the OIDC identity PyPI verifies — this replaces a token
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

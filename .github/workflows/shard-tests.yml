name: shard-tests

# Dispatch-only. Runs the browser/pytest suites of ANY branch or sha sharded across Linux and macOS runners.
# Not wired to push, tag, pull_request or release events, so it can never run by itself and never touches release.yml.
# Start it from main so the workflow file is always main's, and pass the code under test as an input:
#   gh workflow run shard-tests.yml --ref main -f ref=<branch-or-sha> [-f linux=12 -f mac=4]
# Read-only token, no secrets, no cloud or Firebase variables (the suites must run with the cloud store unreachable).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or sha to test"
        required: true
      linux:
        description: "Linux shards (free-plan limit: 20 jobs at once in total)"
        default: "12"
      mac:
        description: "macOS shards, WebKit-using tests only (free-plan limit: 5 macOS jobs at once)"
        default: "4"

permissions:
  contents: read

concurrency:
  group: shard-tests-${{ github.event.inputs.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"
  # Nothing here points at Google, Firebase or a cloud store. ALTO_STORE stays unset.
  PW_V: "1.64.0"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      linux: ${{ steps.m.outputs.linux }}
      mac: ${{ steps.m.outputs.mac }}
    steps:
      - id: m
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          def clamp(v, lo, hi, d):
              try: return max(lo, min(hi, int(v)))
              except Exception: return d
          l = clamp("${{ github.event.inputs.linux }}", 1, 15, 12)
          m = clamp("${{ github.event.inputs.mac }}", 0, 4, 4)
          print("linux=" + json.dumps({"shard": list(range(l)), "of": [l]}))
          print("mac=" + json.dumps({"shard": list(range(m)), "of": [m]} if m else {"shard": [], "of": [0]}))
          EOF

  linux:
    needs: plan
    name: linux ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt "mcp>=1.28,<2" "quickjs>=1.19,<2" "playwright==$PW_V" pytest==9.1.1 pytest-xdist==3.8.0
          python -m playwright install --with-deps chromium webkit
      - name: Run this shard (all test files, balanced by size)
        run: python .github/shard_run.py --shard ${{ matrix.shard }} --of ${{ matrix.of }} --workers 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-linux-${{ matrix.shard }}
          path: junit.xml

  mac:
    needs: plan
    if: ${{ needs.plan.outputs.mac != '' && github.event.inputs.mac != '0' }}
    name: mac ${{ matrix.shard }}/${{ matrix.of }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.mac) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt "mcp>=1.28,<2" "quickjs>=1.19,<2" "playwright==$PW_V" pytest==9.1.1 pytest-xdist==3.8.0
          python -m playwright install webkit
      - name: Run this shard (test files that use WebKit only)
        run: python .github/shard_run.py --shard ${{ matrix.shard }} --of ${{ matrix.of }} --workers 2 --only-webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-mac-${{ matrix.shard }}
          path: junit.xml

  summary:
    needs: [linux, mac]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "linux: ${{ needs.linux.result }}  mac: ${{ needs.mac.result }}" | tee -a "$GITHUB_STEP_SUMMARY"
          [ "${{ needs.linux.result }}" = "success" ] && { [ "${{ needs.mac.result }}" = "success" ] || [ "${{ needs.mac.result }}" = "skipped" ]; }

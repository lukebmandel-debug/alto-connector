name: verify

# Two things are checked here that a laptop cannot check on its own:
#   1. the test suite on a machine that has never seen this project
#   2. the WINDOWS bundle, actually running on Windows
#
# The Windows bundle is cross-built on macOS. Everything about it can be
# verified statically — architecture, manifest, wheel tags — and all of that
# passed while the bundle was in fact broken for every Windows user, because
# none of it proves the thing launches. Only running it does.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest "mcp>=1.28,<2"
      - name: Stage the engine templates
        run: python packaging/stage_engine.py
      - name: Run the suite
        # test_roundtrip skips here by design: its fixtures are private.
        run: python -m pytest tests/ -q

  # Build the bundle natively and run it. This tests the CURRENT code, so a
  # regression is caught before a release rather than after one.
  bundle:
    name: bundle on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-latest
            target: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install the MCPB CLI
        run: npm install -g @anthropic-ai/mcpb
      # build_mcpb.py reads __version__ and WEBSITE_URL straight off the
      # server module, so the core dependency has to be importable here.
      - name: Install
        run: python -m pip install --quiet "mcp>=1.28,<2"

      - name: Build the bundle
        run: python packaging/build_mcpb.py ${{ matrix.target }}

      - name: Launch it and build a timeline
        run: python packaging/probe_bundle.py packaging/dist/Alto-${{ matrix.target }}.mcpb

  # On a release, additionally prove the artifact people actually download is
  # the working one — a bundle can be correct in the repo and stale on the
  # release page.
  released-asset:
    if: github.event_name == 'release'
    name: released asset on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: Alto-windows-x64.mcpb
          - os: macos-latest
            asset: Alto-macos-arm64.mcpb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the released bundle
        shell: bash
        run: |
          curl -sfL -o "${{ matrix.asset }}" \
            "https://github.com/${{ github.repository }}/releases/download/${{ github.event.release.tag_name }}/${{ matrix.asset }}"
      - name: Launch it and build a timeline
        run: python packaging/probe_bundle.py ${{ matrix.asset }}

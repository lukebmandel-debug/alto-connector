name: security

# Firestore and Storage rules, and the share viewer, checked on every push.
# Runs against the Firebase emulator only (a demo- project id, which the
# emulator never connects to a real project); no credentials are used.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/security/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest "mcp>=1.28,<2"
          python packaging/stage_engine.py
      - name: Rules, headers and share checks (Python)
        env:
          PYTHONUTF8: "1"
        run: >
          python -m pytest -q tests/security tests/test_share_links.py
          tests/test_security_headers.py tests/test_cloud_store.py tests/test_new_user.py
      - name: Install emulator suite
        working-directory: tests/security
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Emulator and browser suite
        working-directory: tests/security
        run: npm test

name: security

# Firestore and Storage rules, and the share viewer, checked on every push.
# Runs against the Firebase emulator only (a demo- project id, which the
# emulator never connects to a real project); no credentials are used.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/security/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet pytest "mcp>=1.28,<2" "tzdata; sys_platform == 'win32'"
          python packaging/stage_engine.py
      - name: Rules, headers and share checks (Python)
        env:
          PYTHONUTF8: "1"
        run: >
          python -m pytest -q tests/security tests/test_share_links.py
          tests/test_security_headers.py tests/test_cloud_store.py tests/test_new_user.py
      - name: Install emulator suite
        working-directory: tests/security
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Emulator and browser suite
        working-directory: tests/security
        run: npm test
      - name: Account erase against the Auth, Firestore and Storage emulators
        # tools/erase_account.py (dry run, wrong confirmation, the real erase) on a seeded account with photos (Storage objects and
        # Firestore picture documents); asserts nothing of it is left in Auth, Firestore or Storage and a second account is intact.
        # Emulators only (demo- project, local hosts; the script refuses anything else); never the luke-alto cloud env.
        working-directory: tests/security
        env:
          PYTHONUTF8: "1"
          GCLOUD_PROJECT: demo-alto-security
        run: |
          python -m pip install --quiet "firebase-admin>=6,<7" google-cloud-firestore google-cloud-storage
          npm run prep
          npx firebase emulators:exec --only firestore,storage,auth --project demo-alto-security "python erase_emulator_check.py"

  # The handoff's rules and their owner-only cases, on their own so a failure names them (Board B-1121-HANDOFF-EMU).
  # Actions pinned by full commit SHA; read-only token, no secrets; a demo- project, so the emulator never reaches a real project.
  handoff-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Firestore rules cases (emulator)
        working-directory: tests/security
        run: |
          npm ci --no-audit --no-fund
          npm run prep
          npx --no-install firebase emulators:exec --only firestore --project demo-alto-security "node --test --test-concurrency=1 firestore_rules.test.mjs"

name: release

# Cut the GitHub release — with the three bundles the download page links to —
# from the tag alone, so publishing never depends on one machine's toolchain
# or credentials. Push a `v*` tag (pointing at a commit that contains this
# file) and this builds all three bundles, smoke-tests the two that can run
# natively on hosted runners, and publishes the release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # All three bundles are cross-built on macOS — the same path used for local
  # releases (see packaging/README.md), so CI and a laptop produce the same
  # kind of artifact.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
      - name: Install the MCPB CLI
        run: npm install -g @anthropic-ai/mcpb
      # build_mcpb.py reads __version__ and WEBSITE_URL off the server module.
      - name: Install
        run: python -m pip install --quiet "mcp>=1.28,<2"
      - name: Build all three bundles
        run: python packaging/build_mcpb.py
      - name: Launch the native bundle and build a timeline
        run: python packaging/probe_bundle.py packaging/dist/Alto-macos-arm64.mcpb
      - uses: actions/upload-artifact@v4
        with:
          name: bundles
          path: packaging/dist/*.mcpb
          if-no-files-found: error

  # The Windows bundle is the one most likely to be broken while looking
  # fine statically — prove it launches before it ships.
  probe-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: packaging/dist
      - name: Launch it and build a timeline
        run: python packaging/probe_bundle.py packaging/dist/Alto-windows-x64.mcpb

  publish:
    needs: [build, probe-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundles
          path: packaging/dist
      - name: Create the release with the bundles attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" packaging/dist/*.mcpb --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" packaging/dist/*.mcpb \
              --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes \
              --verify-tag
          fi

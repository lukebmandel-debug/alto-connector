<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Alto — Reports</title>
<style>
  /* Tokens copied from index.html so all Alto pages share one visual system. */
  :root {
    --bg:#f0efea;--surface:#ffffff;--border:#c8c8d8;
    --text:#1a1a2e;--muted:#5a5a80;
    --btn-border:rgba(0,0,0,0.18);
    --btn-hover-bg:rgba(0,0,0,0.06);
    --card-shadow:rgba(0,0,0,0.20);
    --glass-slab-bg:linear-gradient(150deg, rgba(255,255,255,0.34) 0%, rgba(255,255,255,0.15) 100%);
    --glass-slab-border:rgba(255,255,255,0.55);
    --glass-slab-bright:1.04;
    --glass-slab-shadow:inset 0 2px 1px rgba(255,255,255,0.75), inset 0 -22px 46px rgba(110,120,165,0.12), inset 0 -2px 3px rgba(0,0,0,0.05), 0 44px 84px rgba(20,28,60,0.16);
    --node-rest-shadow:rgba(25,32,68,0.126);
    --node-hover-shadow:rgba(25,32,68,0.21);
    --page-grad:linear-gradient(150deg, #8fc1ff 0%, #ffc59e 23%, #ff9fb6 41%, #c7b2ff 59%, #84e6bd 78%, #ffc98a 100%);
    --page-glass-tint:rgba(250,251,255,0.16);
    --page-glass-bright:1.0;
    --header-glass-bg:rgba(255,255,255,0.06);
    --header-hairline:rgba(120,124,150,0.10);
    --card-glass-bg:rgba(255,255,255,0.50);
    --card-glass-bright:1.10;
    --card-glass-hi:rgba(255,255,255,0.65);
    --chip-glass-bg:rgba(255,255,255,0.50);
    --card-glass-border:transparent;
    --card-glass-rim:transparent;
    --panel-glass-bg:rgba(252,252,255,0.72);
  }
  html.dark {
    --bg:#0a0a0f;--surface:#12121a;--border:#1e1e2e;
    --text:#e2e2f0;--muted:#b8b8d8;
    --btn-border:rgba(255,255,255,0.18);
    --btn-hover-bg:rgba(255,255,255,0.08);
    --card-shadow:rgba(0,0,0,0.85);
    --glass-slab-bg:linear-gradient(150deg, rgba(72,76,102,0.36) 0%, rgba(16,18,30,0.22) 100%);
    --glass-slab-border:rgba(255,255,255,0.14);
    --glass-slab-bright:0.95;
    --glass-slab-shadow:inset 0 2px 1px rgba(255,255,255,0.18), inset 0 -22px 46px rgba(0,0,0,0.32), inset 0 -2px 3px rgba(0,0,0,0.45), 0 44px 84px rgba(0,0,0,0.55);
    --node-rest-shadow:rgba(0,0,0,0.385);
    --node-hover-shadow:rgba(0,0,0,0.56);
    --page-grad:linear-gradient(150deg, #1f5a96 0%, #6b4326 23%, #6e2438 41%, #3b2f72 59%, #156a4c 78%, #6b4220 100%);
    --page-glass-tint:rgba(10,11,17,0.20);
    --header-glass-bg:rgba(20,22,34,0.10);
    --header-hairline:rgba(255,255,255,0.05);
    --card-glass-bg:rgba(26,30,48,0.56);
    --card-glass-bright:1.04;
    --card-glass-hi:rgba(255,255,255,0.20);
    --chip-glass-bg:rgba(34,36,52,0.48);
    --card-glass-border:transparent;
    --card-glass-rim:transparent;
    --panel-glass-bg:rgba(18,20,30,0.64);
  }

  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{ color:var(--text); font-family:'Georgia',serif; background:transparent; overflow-x:hidden; }
  #page-bg{ position:fixed; inset:0; z-index:-2; pointer-events:none; background:var(--page-grad); }
  #page-glass{
    position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:var(--page-glass-tint);
    -webkit-backdrop-filter:blur(60px) saturate(185%) brightness(var(--page-glass-bright));
    backdrop-filter:blur(60px) saturate(185%) brightness(var(--page-glass-bright));
  }

  #title-bar{
    position:fixed; top:0; left:0; right:0; height:67px; z-index:100;
    display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:0 26px;
    background:var(--header-glass-bg);
    border-bottom:1px solid var(--header-hairline);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
  }
  #title-bar .brand-mark{ justify-self:start; height:42px; cursor:pointer; }
  #title-bar .brand-word{ justify-self:end; height:26px; opacity:.96; cursor:pointer; }
  #title-bar #title-text{
    justify-self:center; font-size:15px; letter-spacing:.32em; text-transform:uppercase;
    color:var(--muted);
  }
  html.dark .brand-mark .alto-ink{ stroke:url(#altoG2); }
  html.dark .brand-mark .alto-head{ fill:url(#altoG2); stroke:url(#altoG2); }
  html.dark .brand-word .alto-word{ fill:url(#altoWordG2); }

  #reports-wrap{
    min-height:100%; display:flex; flex-direction:column; align-items:center;
    gap:38px; padding:118px 40px 140px;
  }
  #reports-slab{
    width:min(840px, 100%);
    border-radius:28px; padding:40px 46px 46px;
    background:var(--glass-slab-bg);
    border:1px solid var(--glass-slab-border);
    box-shadow:var(--glass-slab-shadow);
    -webkit-backdrop-filter:blur(26px) saturate(170%) brightness(var(--glass-slab-bright));
    backdrop-filter:blur(26px) saturate(170%) brightness(var(--glass-slab-bright));
  }
  .slab-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:8px; }
  .slab-kicker{
    font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--muted);
  }
  #home-link{
    font-size:11.5px; letter-spacing:.08em; color:var(--muted); text-decoration:none;
    border:1px solid var(--btn-border); border-radius:10px; padding:5px 11px;
    background:var(--chip-glass-bg);
  }
  #home-link:hover{ color:var(--text); background:var(--btn-hover-bg); }
  #course-title{ font-size:24px; margin:14px 0 4px; }
  #course-sub{ font-size:12px; color:var(--muted); letter-spacing:.04em; margin-bottom:26px; }
  #unit-strip{ display:flex; height:6px; border-radius:3px; overflow:hidden; margin-bottom:26px; }
  #unit-strip span{ flex:1; }

  .report-row{
    display:flex; align-items:center; gap:16px;
    border-radius:14px; padding:15px 18px; margin-bottom:12px; cursor:pointer;
    background:var(--card-glass-bg); border:1px solid transparent;
    -webkit-backdrop-filter:blur(18px) saturate(190%) brightness(var(--card-glass-bright));
    backdrop-filter:blur(18px) saturate(190%) brightness(var(--card-glass-bright));
    box-shadow:0 10px 26px var(--node-rest-shadow), inset 0 1px 0 var(--card-glass-hi);
    transition:transform .22s cubic-bezier(.34,1.3,.64,1), box-shadow .22s;
  }
  .report-row:hover{
    transform:scale(1.015);
    box-shadow:0 16px 40px var(--node-hover-shadow), inset 0 1px 0 var(--card-glass-hi);
  }
  .rr-glyph{ flex:0 0 auto; color:var(--muted); display:flex; }
  .rr-main{ flex:1 1 auto; min-width:0; }
  .rr-title{ font-size:14.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .rr-date{ font-size:11px; color:var(--muted); letter-spacing:.05em; margin-top:2px; }
  .rr-open{
    flex:0 0 auto; font-size:10px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--muted); border:1px solid var(--btn-border); border-radius:8px; padding:5px 10px;
    background:transparent; cursor:pointer; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .rr-open:hover{ color:var(--text); background:var(--btn-hover-bg); }
  .rr-del{
    flex:0 0 auto; width:24px; height:24px; border-radius:50%; border:none;
    background:transparent; color:var(--muted); font-size:15px; line-height:1; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .rr-del:hover{ color:#c0392b; background:var(--btn-hover-bg); }

  #empty-state{
    text-align:center; padding:46px 20px 30px; color:var(--muted); font-size:14px; line-height:1.8;
  }
  #empty-state .es-glyph{ opacity:.5; margin-bottom:14px; }

  #mode-toggle{
    position:fixed; bottom:24px; right:24px; z-index:200;
    height:36px; display:inline-flex; align-items:center;
    padding:0 14px; border-radius:18px; font-size:12px; letter-spacing:.06em;
    color:var(--muted); cursor:pointer; font-family:inherit;
    background:var(--card-glass-bg); border:1px solid transparent;
    -webkit-backdrop-filter:blur(18px) saturate(190%) brightness(var(--card-glass-bright));
    backdrop-filter:blur(18px) saturate(190%) brightness(var(--card-glass-bright));
    box-shadow:0 10px 26px var(--node-rest-shadow);
  }
  #mode-toggle:hover{ background:var(--btn-hover-bg); color:var(--text); }

  /* ── D1: share / print toolbar + report selection ── */
  .repo-actions{ display:flex; justify-content:flex-end; gap:8px; margin-bottom:14px; flex-wrap:wrap; min-height:1px; }
  .repo-btn{
    font-size:11px; letter-spacing:.1em; text-transform:uppercase;
    color:var(--muted); border:1px solid var(--btn-border); border-radius:9px; padding:6px 12px;
    background:var(--chip-glass-bg); cursor:pointer;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; transition:color .15s, background .15s;
  }
  .repo-btn:hover{ color:var(--text); background:var(--btn-hover-bg); }
  .rr-check{ flex:0 0 auto; width:18px; height:18px; accent-color:#6a5acd; cursor:pointer; margin:0; }
  .report-row.selected{ box-shadow:0 0 0 2px var(--muted), 0 10px 26px var(--node-rest-shadow); }
  #repo-print-host{ display:none; }
  #repo-toast{
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(12px);
    z-index:500; opacity:0; pointer-events:none; max-width:calc(100vw - 40px);
    background:var(--panel-glass-bg); color:var(--text);
    border:1px solid var(--card-glass-border); border-radius:14px; padding:11px 18px;
    font-size:13px; letter-spacing:.02em; box-shadow:0 12px 34px var(--card-shadow);
    -webkit-backdrop-filter:blur(30px) saturate(185%); backdrop-filter:blur(30px) saturate(185%);
    transition:opacity .25s, transform .25s;
  }
  #repo-toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  @media print{
    @page{ margin:14mm; }
    html.printing, html.printing body{ background:#fff !important; }
    html.printing *{
      color:#000 !important; background-color:transparent !important; background-image:none !important;
      box-shadow:none !important; text-shadow:none !important;
      -webkit-backdrop-filter:none !important; backdrop-filter:none !important; border-color:#9a9a9a !important;
    }
    html.printing svg [stroke]{ stroke:#555 !important; }
    html.printing svg [fill]:not([fill="none"]){ fill:#000 !important; }
    html.printing body > *{ display:none !important; }
    html.printing #repo-print-host{ display:block !important; }
    html.printing .repo-print-doc{ page-break-after:always; }
    html.printing .repo-print-doc:last-child{ page-break-after:auto; }
  }

  /* ── MOBILE PASS: same tokens/recipes, phone-sized geometry only ── */
  @media (max-width:640px){
    #reports-wrap{ padding:92px 14px 110px; gap:24px; }
    #reports-slab{ padding:26px 18px 30px; border-radius:22px; }
    #title-bar{ padding:0 16px; height:56px; }
    #title-bar .brand-mark{ height:34px; }
    #title-bar .brand-word{ display:none; }   /* wordmark crowds 375px; clef + title stay */
    #title-bar #title-text{ font-size:12px; letter-spacing:.22em; }
    #course-title{ font-size:20px; }
    .report-row{ padding:13px 14px; gap:10px; flex-wrap:wrap; }
    .rr-title{ white-space:normal; }          /* wrap instead of ellipsing on narrow rows */
    #page-glass{
      -webkit-backdrop-filter:blur(24px) saturate(185%) brightness(var(--page-glass-bright));
      backdrop-filter:blur(24px) saturate(185%) brightness(var(--page-glass-bright));
    }
    #mode-toggle{ bottom:calc(16px + env(safe-area-inset-bottom,0px)); right:16px; }
  }
</style>
<script>/* Restore Alto theme before first paint (shared across index/course/reports). */try{if(localStorage.getItem('alto-theme-v1')==='dark')document.documentElement.classList.add('dark');}catch(e){}</script>
</head>

      <div class="slab-kicker">Report repository</div>
      <a id="home-link" href="index.html">&#8592; Home</a>
    </div>

  </div>

<script>
/* NOTE: reports live in localStorage under 'alto-reports-<courseId>' and are written
   by the course apps (e.g. the timeline page's doGenerateReport). localStorage is
   per-origin: this page sees a course's reports only when both pages are served from
   the same host (e.g. localhost:8099) — file:// opens will NOT share storage. */

// Course display metadata (names + unit colours only — closed-system rule).
/*ALTO:BEGIN course_meta*/const COURSE_META = {};/*ALTO:END course_meta*/

const params = new URLSearchParams(location.search);
const courseId = __ALTO_TOK_default_course__;
const from = params.get('from');
const meta = COURSE_META[courseId] || { title: courseId, project: '', units: [] };
const KEY = 'alto-reports-' + courseId;

// Context-aware back button: return the user to wherever they opened the repository.
// Opened from inside a course (&from=project) → back to that course app; otherwise
// (from the homepage, or a bare link) → back to the homepage.
(function(){
  const back = document.getElementById('home-link');
  if(!back) return;
  if(from === 'project' && meta.app){
    back.href = meta.app;
    back.innerHTML = '← Course';
  } else {
    back.href = 'index.html';
    back.innerHTML = '← Home';
  }
})();

document.getElementById('course-title').textContent = meta.title;
document.getElementById('course-sub').textContent =
  (meta.project ? meta.project + ' · ' : '') + 'Every report generated inside the course is saved here automatically.';
document.getElementById('unit-strip').innerHTML =
  (meta.units || []).map(u => '<span style="background:' + u + '"></span>').join('');
if(!(meta.units || []).length) document.getElementById('unit-strip').style.display = 'none';

function loadReports(){
  try{ return JSON.parse(localStorage.getItem(KEY) || '[]'); }catch(e){ return []; }
}
function saveReports(list){
  try{ localStorage.setItem(KEY, JSON.stringify(list)); }catch(e){}
}
function fmtDate(iso){
  try{
    return new Date(iso).toLocaleString(undefined,
      { month:'long', day:'numeric', year:'numeric', hour:'numeric', minute:'2-digit' });
  }catch(e){ return iso || ''; }
}
function openReport(item){
  // Runs inside a click gesture — popup-safe.
  const w = window.open('', '_blank');
  if(!w) return;
  w.document.write(item.html);
  w.document.close();
}
const RR_GLYPH = '<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="10" height="14" rx="1.5"/><line x1="8" y1="8" x2="12" y2="8"/><line x1="8" y1="11" x2="12" y2="11"/></svg>';
let selectMode = false;
const selectedIds = new Set();
function currentSelectedReports(){ return loadReports().filter(r => selectedIds.has(r.id)); }

function buildToolbar(){
  const bar = document.getElementById('repo-actions');
  if(!bar) return;
  const n = loadReports().length;
  if(!n){ bar.innerHTML = ''; return; }
  if(!selectMode){
    bar.innerHTML = '<button class="repo-btn" id="repo-select">Share / Print&#8230;</button>';
    document.getElementById('repo-select').onclick = () => { selectMode = true; selectedIds.clear(); renderList(); buildToolbar(); };
  } else {
    const allOn = selectedIds.size === n;
    bar.innerHTML =
      '<button class="repo-btn" id="repo-all">' + (allOn ? 'Clear all' : 'Select all') + '</button>' +
      '<button class="repo-btn" id="repo-share">Share (' + selectedIds.size + ')</button>' +
      '<button class="repo-btn" id="repo-print">Print (' + selectedIds.size + ')</button>' +
      '<button class="repo-btn" id="repo-cancel">Done</button>';
    document.getElementById('repo-all').onclick = () => {
      const list = loadReports();
      if(selectedIds.size === list.length){ selectedIds.clear(); } else { list.forEach(r => selectedIds.add(r.id)); }
      renderList(); buildToolbar();
    };
    document.getElementById('repo-share').onclick = () => shareReports(currentSelectedReports());
    document.getElementById('repo-print').onclick = () => printReports(currentSelectedReports());
    document.getElementById('repo-cancel').onclick = () => { selectMode = false; selectedIds.clear(); renderList(); buildToolbar(); };
  }
}

function renderList(){
  const list = loadReports();
  const wrap = document.getElementById('report-list');
  wrap.innerHTML = '';
  if(!list.length){
    wrap.innerHTML =
      '<div id="empty-state">' +
        '<div class="es-glyph"><svg viewBox="0 0 20 20" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="10" height="14" rx="1.5"/><line x1="8" y1="8" x2="12" y2="8"/><line x1="8" y1="11" x2="12" y2="11"/></svg></div>' +
        'No reports yet.<br>Generate one from inside the course &#8212; it will appear here automatically.' +
      '</div>';
    return;
  }
  list.forEach(item => {
    const on = selectMode && selectedIds.has(item.id);
    const row = document.createElement('div');
    row.className = 'report-row' + (on ? ' selected' : '');
    row.innerHTML =
      (selectMode ? '<input type="checkbox" class="rr-check"' + (on ? ' checked' : '') + '>' : '') +
      '<span class="rr-glyph">' + RR_GLYPH + '</span>' +
      '<span class="rr-main"><span class="rr-title"></span><div class="rr-date"></div></span>' +
      '<button class="rr-open">Open</button>' +
      '<button class="rr-del" aria-label="Delete report">&#215;</button>';
    row.querySelector('.rr-title').textContent = item.title || 'Study Report';
    row.querySelector('.rr-date').textContent = fmtDate(item.dateISO);
    if(selectMode){
      const toggle = () => { if(selectedIds.has(item.id)) selectedIds.delete(item.id); else selectedIds.add(item.id); renderList(); buildToolbar(); };
      row.addEventListener('click', e => { if(e.target.closest('.rr-open,.rr-del')) return; toggle(); });
    } else {
      row.addEventListener('click', () => openReport(item));
    }
    row.querySelector('.rr-open').addEventListener('click', e => { e.stopPropagation(); openReport(item); });
    row.querySelector('.rr-del').addEventListener('click', e => {
      e.stopPropagation();
      if(!confirm('Delete this report? This cannot be undone.')) return;
      selectedIds.delete(item.id);
      saveReports(loadReports().filter(r => r.id !== item.id));
      renderList(); buildToolbar();
    });
    wrap.appendChild(row);
  });
}

// Extract a report's own <style> + <body> so it renders faithfully inside a print/share section.
function _reportForPrint(fullHtml){
  try{
    const doc = new DOMParser().parseFromString(fullHtml || '', 'text/html');
    const styles = Array.prototype.map.call(doc.querySelectorAll('style'), s => s.outerHTML).join('');
    return styles + (doc.body ? doc.body.innerHTML : '');
  }catch(e){ return fullHtml || ''; }
}
function printReports(reports){
  if(!reports.length){ showToast('Select at least one report'); return; }
  let host = document.getElementById('repo-print-host');
  if(!host){ host = document.createElement('div'); host.id = 'repo-print-host'; document.body.appendChild(host); }
  host.innerHTML = reports.map(r => '<section class="repo-print-doc">' + _reportForPrint(r.html) + '</section>').join('');
  const root = document.documentElement; root.classList.add('printing');
  const cleanup = () => { root.classList.remove('printing'); host.innerHTML = ''; window.removeEventListener('afterprint', cleanup); };
  window.addEventListener('afterprint', cleanup);
  setTimeout(() => { try{ window.print(); }catch(e){} setTimeout(cleanup, 1500); }, 80);
}
async function shareReports(reports){
  if(!reports.length){ showToast('Select at least one report'); return; }
  const combined = '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Alto reports</title></head><body>' +
    reports.map(r => '<section style="page-break-after:always">' + _reportForPrint(r.html) + '</section>').join('') +
    '</body></html>';
  const fname = reports.length === 1
    ? ((reports[0].title || 'report').replace(/[^\w -]+/g, '').trim().slice(0, 40) || 'report') + '.html'
    : 'alto-reports-' + reports.length + '.html';
  const blob = new Blob([combined], { type: 'text/html' });
  try{
    if(navigator.canShare){
      const file = new File([blob], fname, { type: 'text/html' });
      if(navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: 'Alto reports' }); return; }
    }
  }catch(e){ if(e && e.name === 'AbortError') return; }
  // fallback: download the combined HTML
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fname;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  showToast('Saved ' + fname);
}
function showToast(msg){
  let el = document.getElementById('repo-toast');
  if(!el){ el = document.createElement('div'); el.id = 'repo-toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(showToast._t); showToast._t = setTimeout(() => el.classList.remove('show'), 2500);
}
renderList();
buildToolbar();

function toggleMode(){
  const isDark = document.documentElement.classList.toggle('dark');
  document.getElementById('mode-toggle').innerHTML = isDark ? '&#9788; Light' : '&#9789; Dark';
  try{ localStorage.setItem('alto-theme-v1', isDark ? 'dark' : 'light'); }catch(e){}
}
// Reflect a restored dark theme on the toggle label (class was set pre-paint).
if(document.documentElement.classList.contains('dark')){
  const _mt = document.getElementById('mode-toggle');
  if(_mt) _mt.innerHTML = '&#9788; Light';
}
</script>
<script type="module" src="alto-cloud.js"></script>
</body>

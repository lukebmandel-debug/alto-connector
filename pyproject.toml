[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alto-connector"
version = "1.0.0"
description = "Build interactive timelines from your own materials — an MCP connector for Claude"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Luke Mandel" }]
keywords = ["mcp", "claude", "timeline", "study", "law", "notes"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Education",
]

# Only what the local stdio connector needs. fastapi/uvicorn/itsdangerous/
# firebase-admin/google-cloud-storage belong to the parked hosted variant
# (alto/web.py, alto/auth/) and live in requirements-remote.txt — pulling them
# in here would add tens of megabytes to every install and .mcpb bundle.
dependencies = ["mcp>=1.28,<2"]

[project.urls]
Homepage = "https://alto-connector.web.app"

[project.scripts]
alto-connector = "alto.mcp_server:main"

[tool.setuptools.packages.find]
include = ["alto*"]

[tool.setuptools.package-data]
"alto" = [
  "interview_guide.md",
  "privacy.html",
  "assets/*.svg",
  "assets/png/*.png",
  "cloud/*.js",
  # Copied in by packaging/stage_engine.py; generated, so gitignored.
  "engine/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
